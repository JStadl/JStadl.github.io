<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  {% if config.generate_feeds %}
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='rss.xml') }}">
  {% endif %}
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="site-title" href="{{ get_url(path='/') }}">{{ config.title }}</a>
      <div class="nav-links">
        <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
        <a href="{{ get_url(path='@/projects/_index.md') }}">Projects</a>
        <a href="{{ config.extra.github }}" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author }}</p>
  </footer>
</body>
</html>
